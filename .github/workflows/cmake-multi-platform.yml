name: multi platform test

on:
  push:
    branches: [ "trunk", "develop" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - cpp_compiler: g++-15
            os: ubuntu-26.04
          - cpp_compiler: g++-16
            os: ubuntu-26.04
          # - cpp_compiler: clang-20
          #   os: ubuntu-26.04
          # - cpp_compiler: clang-21
          #   os: ubuntu-26.04
          # - cpp_compiler: clang-22
          #   os: ubuntu-26.04
          - cpp_compiler: cl
            os: windows-latest
          - cpp_compiler: clang++
            os: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set reusable strings
      id: strings
      shell: bash
      run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install dependencies Ubuntu
      if: matrix.os == 'ubuntu-26.04'
      run: sudo apt-get update && sudo apt-get install mrc catch2 libsqlite3-dev ${{ matrix.cpp_compiler }}

    - name: Install dependencies Window
      if: matrix.os == 'windows-latest'
      run: ./tools/depends.cmd
      shell: cmd

    - name: Install Catch2 macOS
      if: matrix.os == 'macos-latest'
      run: >
        brew install catch2 fast_float

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCIFPP_DOWNLOAD_CCD=OFF
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}
        
    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release
      
    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config Release --output-on-failure

    - name: Install
      if: matrix.os != 'windows-latest'
      run: sudo cmake --install ${{ steps.strings.outputs.build-output-dir }} --config Release
